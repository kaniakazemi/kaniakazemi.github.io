<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kania Kazemi — Portfolio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1814;
    --surface: #211f1b;
    --gold: #c8a96e;
    --gold-dim: #8a7050;
    --shadow: rgba(0,0,0,0.7);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'Raleway', sans-serif;
    font-weight: 500;
    color: #d4cfc7;
    overflow: hidden;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: var(--surface);
    border-bottom: 0.5px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    z-index: 100;
  }
  .header-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.12em;
    color: #ffffff;
    text-transform: uppercase;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .page-indicator {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #888;
  }
  .download-btn {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    text-transform: uppercase;
    border: 0.5px solid rgba(255,255,255,0.4);
    padding: 5px 14px;
    transition: color 0.2s, border-color 0.2s;
  }
  .download-btn:hover { color: #ffffff; border-color: #ffffff; }

  #viewer {
    position: fixed;
    top: 52px; bottom: 80px; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #spread {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    height: 100%;
    transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
  }
  #spread.exit-left {
    transform: translateX(calc(-100vw - 80px));
    opacity: 0;
    transition: transform 0.36s cubic-bezier(0.4, 0, 1, 0.6), opacity 0.28s ease;
  }
  #spread.exit-right {
    transform: translateX(calc(100vw + 80px));
    opacity: 0;
    transition: transform 0.36s cubic-bezier(0.4, 0, 1, 0.6), opacity 0.28s ease;
  }
  #spread.start-right {
    transform: translateX(calc(100vw + 80px));
    opacity: 0;
    transition: none;
  }
  #spread.start-left {
    transform: translateX(calc(-100vw - 80px));
    opacity: 0;
    transition: none;
  }

  canvas {
    display: block;
    max-height: 100%;
    image-rendering: high-quality;
  }
  #canvas-left  { box-shadow: -2px 0 8px rgba(0,0,0,0.4), 0 20px 60px var(--shadow); }
  #canvas-right { box-shadow:  2px 0 8px rgba(0,0,0,0.4), 0 20px 60px var(--shadow); }
  #canvas-left.single  { box-shadow: 0 20px 80px var(--shadow); }

  #spine {
    width: 3px;
    background: linear-gradient(to right, rgba(0,0,0,0.6), rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.05));
    align-self: stretch;
  }

  /* Loading */
  #loading {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 200;
    transition: opacity 0.8s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .loading-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: #ffffff;
    text-transform: uppercase;
  }
  .loading-sub {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #555;
    text-transform: uppercase;
  }
  .progress-bar {
    width: 180px; height: 1px;
    background: #2e2c28;
  }
  .progress-fill {
    height: 100%;
    background: #ffffff;
    width: 0%;
    transition: width 0.2s;
  }

  /* Controls */
  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: var(--surface);
    border-top: 0.5px solid #2e2c28;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    z-index: 100;
  }

  .nav-btn {
    background: none;
    border: 0.5px solid #444;
    color: #999;
    font-family: 'Raleway', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 10px 28px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-btn:hover:not(:disabled) { border-color: #ffffff; color: #ffffff; }
  .nav-btn:disabled { opacity: 0.2; cursor: default; }
  .nav-btn svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }

  .center-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 160px;
  }
  .spread-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-style: italic;
    color: #666;
    letter-spacing: 0.05em;
    text-align: center;
  }
  .dots {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 260px;
  }
  .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #3a3830;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    flex-shrink: 0;
  }
  .dot.active { background: #ffffff; transform: scale(1.6); }
  .dot:hover:not(.active) { background: #666; }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-title">Kania Kazemi</div>
  <div class="loading-sub">Architectural Portfolio</div>
  <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
</div>

<header>
  <div class="header-title">Kania · Kazemi &nbsp;—&nbsp; Portfolio</div>
  <div class="header-right">
    <span class="page-indicator" id="hdr-info"></span>
    <a href="Portfolio_KaniaKazemi.pdf" download class="download-btn">Download PDF</a>
  </div>
</header>

<div id="viewer">
  <div id="spread">
    <canvas id="canvas-left"></canvas>
    <div id="spine" style="display:none"></div>
    <canvas id="canvas-right" style="display:none"></canvas>
  </div>
</div>

<div id="controls">
  <button class="nav-btn" id="btn-prev">
    <svg viewBox="0 0 12 12"><path d="M8 1L3 6l5 5V1z"/></svg>
    Previous
  </button>
  <div class="center-info">
    <div class="spread-label" id="spread-label"></div>
    <div class="dots" id="dots"></div>
  </div>
  <button class="nav-btn" id="btn-next">
    Next
    <svg viewBox="0 0 12 12"><path d="M4 1l5 5-5 5V1z"/></svg>
  </button>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const PDF_URL = 'Portfolio_KaniaKazemi.pdf';

  let pdf = null;
  let totalPages = 0;
  let spreads = [];
  let current = 0;
  let busy = false;
  const pageCache = {};

  // Build spread list: [1], [2,3], [4,5], ..., [N]
  function buildSpreads(n) {
    const s = [];
    s.push([1]);
    for (let p = 2; p < n; p += 2) {
      if (p + 1 <= n - 1) s.push([p, p + 1]);
      else s.push([p]);
    }
    s.push([n]);
    return s;
  }

  async function fetchPage(num) {
    if (!pageCache[num]) pageCache[num] = await pdf.getPage(num);
    return pageCache[num];
  }

  function viewerSize() {
    const el = document.getElementById('viewer');
    return { w: el.clientWidth - 40, h: el.clientHeight - 20 };
  }

  function calcScale(viewport, dual) {
    const { w, h } = viewerSize();
    const maxW = dual ? w / 2 : w;
    return Math.min(maxW / viewport.width, h / viewport.height, 2.5);
  }

  async function renderSpread(idx, direction = null) {
    if (busy) return;
    busy = true;

    const spread = spreads[idx];
    const dual = spread.length === 2;

    const spreadEl  = document.getElementById('spread');
    const canvasL   = document.getElementById('canvas-left');
    const canvasR   = document.getElementById('canvas-right');
    const spineEl   = document.getElementById('spine');

    // Slide out current spread
    if (direction) {
      spreadEl.classList.add(direction === 'forward' ? 'exit-left' : 'exit-right');
      await new Promise(r => setTimeout(r, 360));
      // Snap instantly to the incoming side (no transition)
      spreadEl.classList.remove('exit-left', 'exit-right');
      spreadEl.classList.add(direction === 'forward' ? 'start-right' : 'start-left');
    }

    const pg1 = await fetchPage(spread[0]);
    const vp1 = pg1.getViewport({ scale: calcScale(pg1.getViewport({ scale: 1 }), dual) });

    canvasL.width  = vp1.width;
    canvasL.height = vp1.height;
    await pg1.render({ canvasContext: canvasL.getContext('2d'), viewport: vp1 }).promise;

    if (dual) {
      const pg2 = await fetchPage(spread[1]);
      const vp2 = pg2.getViewport({ scale: calcScale(pg2.getViewport({ scale: 1 }), true) });
      canvasR.width  = vp2.width;
      canvasR.height = vp2.height;
      await pg2.render({ canvasContext: canvasR.getContext('2d'), viewport: vp2 }).promise;
      canvasR.style.display = '';
      spineEl.style.display = '';
      spineEl.style.height  = vp1.height + 'px';
      canvasL.className = '';
    } else {
      canvasR.style.display = 'none';
      spineEl.style.display = 'none';
      canvasL.className = 'single';
    }

    // Slide in new spread
    if (direction) {
      spreadEl.offsetHeight; // flush layout so start position is applied
      spreadEl.classList.remove('start-right', 'start-left');
      await new Promise(r => setTimeout(r, 520));
    }

    updateUI(idx);
    busy = false;

    // Preload neighbours
    if (idx + 1 < spreads.length) spreads[idx + 1].forEach(fetchPage);
    if (idx - 1 >= 0)             spreads[idx - 1].forEach(fetchPage);
  }

  function updateUI(idx) {
    const spread = spreads[idx];
    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === spreads.length - 1;

    let label;
    if (idx === 0) label = 'Cover';
    else if (idx === spreads.length - 1) label = 'Back cover';
    else if (spread.length === 1) label = `Page ${spread[0]}`;
    else label = `Pages ${spread[0]} – ${spread[1]}`;

    document.getElementById('spread-label').textContent = label;
    document.getElementById('hdr-info').textContent = label;

    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === idx);
    });
  }

  function buildDots() {
    const strip = document.getElementById('dots');
    strip.innerHTML = '';
    // Max 30 visible dots
    const maxDots = 30;
    const step = spreads.length > maxDots ? Math.ceil(spreads.length / maxDots) : 1;
    for (let i = 0; i < spreads.length; i += step) {
      const capturedI = i;
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.addEventListener('click', () => go(capturedI));
      strip.appendChild(dot);
    }
  }

  function go(idx) {
    if (idx === current || busy) return;
    const direction = idx > current ? 'forward' : 'backward';
    current = idx;
    renderSpread(current, direction);
  }
  function goNext() { if (current < spreads.length - 1) go(current + 1); }
  function goPrev() { if (current > 0) go(current - 1); }

  document.getElementById('btn-next').addEventListener('click', goNext);
  document.getElementById('btn-prev').addEventListener('click', goPrev);

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goNext();
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goPrev();
  });

  let tx = 0;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
  document.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) dx < 0 ? goNext() : goPrev();
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      Object.keys(pageCache).forEach(k => delete pageCache[k]);
      renderSpread(current);
    }, 250);
  });

  async function init() {
    const prog = document.getElementById('prog');
    try {
      pdf = await pdfjsLib.getDocument({
        url: PDF_URL,
        cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
        cMapPacked: true,
        onProgress: ({ loaded, total }) => {
          if (total) prog.style.width = Math.round((loaded / total) * 100) + '%';
        }
      }).promise;
    } catch (err) {
      console.error('PDF load error:', err);
      document.querySelector('.loading-sub').textContent = 'Error loading PDF — check filename matches exactly';
      return;
    }

    totalPages = pdf.numPages;
    spreads = buildSpreads(totalPages);
    buildDots();

    await renderSpread(0);
    document.getElementById('loading').classList.add('hidden');
  }

  init();
</script>
</body>
</html>
